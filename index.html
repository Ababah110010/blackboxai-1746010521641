<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Necromancer Game</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    body {
      font-family: 'Orbitron', sans-serif;
      background: #1a202c;
      color: #e2e8f0;
    }
    .game-container {
      max-width: 900px;
      margin: 2rem auto;
      background: #2d3748;
      border-radius: 0.5rem;
      padding: 1rem;
      box-shadow: 0 0 15px #4a5568;
      user-select: none;
    }
    .game-area {
      position: relative;
      width: 100%;
      height: 400px;
      background: #4a5568;
      border-radius: 0.5rem;
      overflow: hidden;
    }
    .character, .enemy, .ally {
      position: absolute;
      width: 50px;
      height: 50px;
      border-radius: 0.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 24px;
      cursor: default;
      user-select: none;
    }
    .necromancer {
      background: linear-gradient(135deg, #6b46c1, #9f7aea);
      box-shadow: 0 0 10px #9f7aea;
      animation: pulse 2s infinite;
      z-index: 10;
    }
    .enemy {
      background: linear-gradient(135deg, #e53e3e, #feb2b2);
      box-shadow: 0 0 8px #e53e3e;
      animation: walk 3s infinite alternate ease-in-out;
    }
    .ally {
      background: linear-gradient(135deg, #38a169, #9ae6b4);
      box-shadow: 0 0 8px #38a169;
      animation: walk 3s infinite alternate ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 10px #9f7aea; }
      50% { box-shadow: 0 0 20px #d6bcfa; }
    }
    @keyframes walk {
      0% { transform: translateX(0); }
      100% { transform: translateX(10px); }
    }
    .health-bar {
      position: absolute;
      bottom: -10px;
      left: 0;
      width: 100%;
      height: 6px;
      background: #718096;
      border-radius: 3px;
      overflow: hidden;
    }
    .health-fill {
      height: 100%;
      background: #48bb78;
      transition: width 0.3s ease;
    }
    .info-panel {
      margin-top: 1rem;
      display: flex;
      justify-content: space-between;
      font-size: 14px;
    }
    button {
      background: #6b46c1;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      font-weight: 600;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background: #9f7aea;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <h1 class="text-3xl font-bold mb-4 text-center">Necromancer Game</h1>
    <div class="game-area" id="gameArea" tabindex="0" aria-label="Game area. Use arrow keys to move the necromancer and space to attack.">
      <!-- Characters will be dynamically added here -->
    </div>
    <div class="info-panel">
      <div>Use arrow keys to move. Press Space to attack.</div>
      <div>Allies: <span id="allyCount">0</span></div>
    </div>
  </div>

  <script>
    const gameArea = document.getElementById('gameArea');
    const allyCountSpan = document.getElementById('allyCount');

    const gameWidth = gameArea.clientWidth;
    const gameHeight = gameArea.clientHeight;

    // Character base class
    class Character {
      constructor(x, y, strength, type) {
        this.x = x;
        this.y = y;
        this.strength = strength;
        this.type = type; // 'necromancer', 'enemy', 'ally'
        this.health = 100;
        this.alive = true;
        this.element = document.createElement('div');
        this.element.classList.add('character', type);
        this.element.style.left = this.x + 'px';
        this.element.style.top = this.y + 'px';
        this.healthBar = document.createElement('div');
        this.healthBar.classList.add('health-bar');
        this.healthFill = document.createElement('div');
        this.healthFill.classList.add('health-fill');
        this.healthBar.appendChild(this.healthFill);
        this.element.appendChild(this.healthBar);
        this.updateHealthBar();
        gameArea.appendChild(this.element);
      }
      updatePosition() {
        this.element.style.left = this.x + 'px';
        this.element.style.top = this.y + 'px';
      }
      updateHealthBar() {
        this.healthFill.style.width = this.health + '%';
        if (this.health > 60) {
          this.healthFill.style.background = '#48bb78'; // green
        } else if (this.health > 30) {
          this.healthFill.style.background = '#ecc94b'; // yellow
        } else {
          this.healthFill.style.background = '#f56565'; // red
        }
      }
      takeDamage(amount) {
        this.health -= amount;
        if (this.health <= 0) {
          this.health = 0;
          this.alive = false;
          this.element.style.opacity = '0.5';
        }
        this.updateHealthBar();
      }
      remove() {
        gameArea.removeChild(this.element);
      }
    }

    // Necromancer class
    class Necromancer extends Character {
      constructor(x, y) {
        super(x, y, 50, 'necromancer');
        this.allies = [];
      }
      move(dx, dy) {
        this.x = Math.min(Math.max(this.x + dx, 0), gameWidth - 50);
        this.y = Math.min(Math.max(this.y + dy, 0), gameHeight - 50);
        this.updatePosition();
      }
      attack(enemies) {
        // Attack enemies in range (50px radius)
        const attackRange = 50;
        for (let enemy of enemies) {
          if (!enemy.alive) continue;
          const dist = Math.hypot(enemy.x - this.x, enemy.y - this.y);
          if (dist <= attackRange) {
            enemy.takeDamage(50);
            if (!enemy.alive) {
              // If enemy strength <= necromancer strength, convert to ally
              if (enemy.strength <= this.strength) {
                enemy.type = 'ally';
                enemy.element.classList.remove('enemy');
                enemy.element.classList.add('ally');
                enemy.health = 100;
                enemy.alive = true;
                enemy.updateHealthBar();
                this.allies.push(enemy);
                updateAllyCount();
              } else {
                // Enemy is stronger, remove from game
                enemy.remove();
                enemies.splice(enemies.indexOf(enemy), 1);
              }
            }
          }
        }
      }
    }

    // Initialize game characters
    const necromancer = new Necromancer(100, 175);

    const enemies = [];
    // Create some enemies with varying strength and positions
    enemies.push(new Character(400, 100, 30, 'enemy'));
    enemies.push(new Character(500, 250, 60, 'enemy'));
    enemies.push(new Character(600, 150, 40, 'enemy'));
    enemies.push(new Character(700, 300, 20, 'enemy'));

    function updateAllyCount() {
      allyCountSpan.textContent = necromancer.allies.length;
    }

    // Handle keyboard input
    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.key] = true;
      if (e.key === ' ' || e.key === 'Spacebar') {
        e.preventDefault();
        necromancer.attack(enemies);
      }
    });
    window.addEventListener('keyup', (e) => {
      keys[e.key] = false;
    });

    function gameLoop() {
      let dx = 0, dy = 0;
      if (keys['ArrowUp']) dy -= 5;
      if (keys['ArrowDown']) dy += 5;
      if (keys['ArrowLeft']) dx -= 5;
      if (keys['ArrowRight']) dx += 5;
      necromancer.move(dx, dy);

      // Move allies randomly near necromancer
      necromancer.allies.forEach((ally, i) => {
        if (!ally.alive) return;
        const angle = (Date.now() / 1000 + i) * 2;
        ally.x = necromancer.x + 60 * Math.cos(angle);
        ally.y = necromancer.y + 60 * Math.sin(angle);
        ally.updatePosition();
      });

      // Move enemies randomly
      enemies.forEach(enemy => {
        if (!enemy.alive) return;
        const moveX = (Math.random() - 0.5) * 4;
        const moveY = (Math.random() - 0.5) * 4;
        enemy.x = Math.min(Math.max(enemy.x + moveX, 0), gameWidth - 50);
        enemy.y = Math.min(Math.max(enemy.y + moveY, 0), gameHeight - 50);
        enemy.updatePosition();
      });

      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
